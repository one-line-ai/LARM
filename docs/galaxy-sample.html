    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){let dx=P[i][0]-P[j][0],dy=P[i][1]-P[j][1],dz=P[i][2]-P[j][2];let d2=dx*dx+dy*dy+dz*dz+0.5;const f=k*k/d2*0.9;F[i][0]+=dx*f;F[i][1]+=dy*f;F[i][2]+=dz*f;F[j][0]-=dx*f;F[j][1]-=dy*f;F[j][2]-=dz*f;}
    for(const [a,b] of E){const dx=P[a][0]-P[b][0],dy=P[a][1]-P[b][1],dz=P[a][2]-P[b][2];const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01;const w=Math.min(deg[a],deg[b])>20?0.35:1; const f=d/k*0.12*w;F[a][0]-=dx*f;F[a][1]-=dy*f;F[a][2]-=dz*f;F[b][0]+=dx*f;F[b][1]+=dy*f;F[b][2]+=dz*f;}
    for(let i=0;i<n;i++){const c=center[nodes[i].scope]||[0,0,0]; const g=deg[i]>=10?0.02:0.008; F[i][0]+=(c[0]-P[i][0])*g;F[i][1]+=(c[1]-P[i][1])*g;F[i][2]+=(c[2]-P[i][2])*g; F[i][0]-=P[i][0]*0.004;F[i][1]-=P[i][1]*0.004;F[i][2]-=P[i][2]*0.004;}
    for(let i=0;i<n;i++){const m=Math.hypot(F[i][0],F[i][1],F[i][2])||1;const s=Math.min(m,t)/m;P[i][0]+=F[i][0]*s;P[i][1]+=F[i][1]*s;P[i][2]+=F[i][2]*s;}
    t=Math.max(0.3,t*0.985);
  }
  return {P,deg,E,idx};
}

// ---------- Three.js 장면 ----------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0B0A1F); scene.fog=new THREE.FogExp2(0x0B0A1F,0.0032);
const camera=new THREE.PerspectiveCamera(55,1,0.1,4000);
function starTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(0.25,'rgba(255,255,255,.85)');r.addColorStop(0.5,'rgba(255,255,255,.25)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const tex=starTex();
// 배경 별
{const N=2600,pos=new Float32Array(N*3);let s=11;const r=()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296;};for(let i=0;i<N;i++){const R=600+r()*900,th=r()*Math.PI*2,ph=Math.acos(2*r()-1);pos[i*3]=R*Math.sin(ph)*Math.cos(th);pos[i*3+1]=R*Math.sin(ph)*Math.sin(th);pos[i*3+2]=R*Math.cos(ph);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));const m=new THREE.PointsMaterial({size:2.2,map:tex,color:0x8785A8,transparent:true,opacity:.55,depthWrite:false,sizeAttenuation:true});scene.add(new THREE.Points(g,m));}

let G=null; // 현재 그래프 상태
function buildGraph(data){
  if(G){scene.remove(G.points,G.lines,G.halos);G.labels.forEach(l=>l.remove());}
  const nodes=data.nodes, edges=data.edges.filter(e=>nodes.some(n=>n.id===e.from)&&nodes.some(n=>n.id===e.to));
  const {P,deg,E,idx}=layout(nodes,edges);
  const n=nodes.length; const pos=new Float32Array(n*3), col=new Float32Array(n*3), size=new Float32Array(n);
  const base=[]; nodes.forEach((d,i)=>{pos[i*3]=P[i][0];pos[i*3+1]=P[i][1];pos[i*3+2]=P[i][2];const t=TYPE[d.type]||TYPE.Evidence;let c=new THREE.Color(t.c);if(d.type==='Finding')c=new THREE.Color(d.severity==='high'?'#FF8A80':'#F2B544');base.push(c);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;size[i]=(t.s+Math.min(2.2,Math.sqrt(deg[i])*.45))*3.2;});
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.setAttribute('size',new THREE.BufferAttribute(size,1));
  const mat=new THREE.ShaderMaterial({uniforms:{map:{value:tex}},vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`attribute float size;varying vec3 vC;void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=size*(330.0/-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform sampler2D map;varying vec3 vC;void main(){vec4 t=texture2D(map,gl_PointCoord);gl_FragColor=vec4(vC*t.rgb,t.a);}`});
  const points=new THREE.Points(geo,mat); scene.add(points);
  // 간선
  const lp=new Float32Array(E.length*6), lc=new Float32Array(E.length*6);
  E.forEach(([a,b],i)=>{lp.set([...P[a],...P[b]],i*6);});
  const lgeo=new THREE.BufferGeometry();lgeo.setAttribute('position',new THREE.BufferAttribute(lp,3));lgeo.setAttribute('color',new THREE.BufferAttribute(lc,3));
  const lines=new THREE.LineSegments(lgeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.75,depthWrite:false,blending:THREE.AdditiveBlending})); scene.add(lines);
  // 높은 위험 후광
  const hi=nodes.map((d,i)=>d.type==='Finding'&&d.severity==='high'?i:-1).filter(i=>i>=0);
  const hp=new Float32Array(hi.length*3);hi.forEach((i,j)=>hp.set(P[i],j*3));const hg=new THREE.BufferGeometry();hg.setAttribute('position',new THREE.BufferAttribute(hp,3));
  const halos=new THREE.Points(hg,new THREE.PointsMaterial({size:26,map:tex,color:0xFF6B6B,transparent:true,opacity:.28,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(halos);
  // 이웃 목록
  const adj=nodes.map(()=>[]); E.forEach(([a,b],i)=>{adj[a].push([b,edges[i]]);adj[b].push([a,edges[i]]);});
  // 라벨 DOM
  const labels=nodes.map((d,i)=>{const el=document.createElement('div');el.className='lbl'+(['Agent','Project','Device'].includes(d.type)?' hub':d.type==='Finding'?' find':'');el.textContent=d.label.length>34?d.label.slice(0,33)+'…':d.label;el.style.display='none';document.body.appendChild(el);return el;});
  const R=Math.max(...P.map(p=>Math.hypot(p[0],p[1],p[2])));
  G={nodes,edges,P,deg,E,idx,points,lines,halos,adj,base,geo,lgeo,labels,visible:new Array(n).fill(true),focus:-1,neighborOnly:false,fitDist:Math.max(120,R*2.4)};
  applyColors(); updateTypes(); updateCount();
}
function applyColors(){
  const {nodes,base,geo,lgeo,E,adj,focus,visible}=G; const c=geo.attributes.color.array, lc=lgeo.attributes.color.array;
  const rel=new Set(); if(focus>=0){rel.add(focus);adj[focus].forEach(([j])=>rel.add(j));}
  nodes.forEach((d,i)=>{let k=1; if(!visible[i])k=0.06; else if(focus>=0)k=rel.has(i)?1.0:0.16; const b=base[i];c[i*3]=b.r*k;c[i*3+1]=b.g*k;c[i*3+2]=b.b*k;});
  E.forEach(([a,b],i)=>{let k=0.32; if(!visible[a]||!visible[b])k=0.02; else if(focus>=0)k=(a===focus||b===focus)?0.95:0.05; const col=(a===focus||b===focus)?new THREE.Color('#EFE9DE'):new THREE.Color('#A9A6E6'); lc.set([col.r*k,col.g*k,col.b*k,col.r*k,col.g*k,col.b*k],i*6);});
  geo.attributes.color.needsUpdate=true; lgeo.attributes.color.needsUpdate=true;
}
// ---------- 카메라 ----------
const cam={target:new THREE.Vector3(0,0,0),theta:0.6,phi:1.15,dist:260,tween:null};
function placeCamera(){camera.position.set(cam.target.x+cam.dist*Math.sin(cam.phi)*Math.cos(cam.theta),cam.target.y+cam.dist*Math.cos(cam.phi),cam.target.z+cam.dist*Math.sin(cam.phi)*Math.sin(cam.theta));camera.lookAt(cam.target);}
function flyTo(target,dist,ms){const from={t:cam.target.clone(),d:cam.dist};cam.tween={from,to:{t:target.clone(),d:dist},t0:performance.now(),ms:reduced?0:ms};}
function stepTween(){const w=cam.tween;if(!w)return;const u=Math.min(1,(performance.now()-w.t0)/Math.max(1,w.ms));const e=u<.5?2*u*u:-1+(4-2*u)*u;cam.target.lerpVectors(w.from.t,w.to.t,e);cam.dist=w.from.d+(w.to.d-w.from.d)*e;if(u>=1)cam.tween=null;}
let drag=null;
canvas.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,moved:false,pan:e.shiftKey||e.button===2};});
window.addEventListener('mousemove',e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;if(drag.pan){const right=new THREE.Vector3().subVectors(camera.position,cam.target).cross(camera.up).normalize();const up=camera.up.clone();cam.target.addScaledVector(right,dx*cam.dist*0.0016).addScaledVector(up,dy*cam.dist*0.0016);}else{cam.theta-=dx*0.005;cam.phi=Math.min(3.0,Math.max(0.15,cam.phi-dy*0.005));}drag.x=e.clientX;drag.y=e.clientY;}else hover(e);});
window.addEventListener('mouseup',e=>{if(drag&&!drag.moved)click(e);drag=null;});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.dist=Math.min(900,Math.max(12,cam.dist*Math.exp(e.deltaY*0.0012)));},{passive:false});
canvas.addEventListener('dblclick',()=>{if(G.focus>=0)toggleNeighbor(true);});
window.addEventListener('keydown',e=>{if(e.key==='Escape')home();if(e.key==='n'&&G.focus>=0)toggleNeighbor();});
// ---------- 선택 ----------
const ray=new THREE.Raycaster(); ray.params.Points.threshold=3.5; const mouse=new THREE.Vector2();
function pick(e){mouse.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObject(G.points);for(const h of hits){if(G.visible[h.index])return h.index;}return -1;}
const tip=document.getElementById('tip');
function hover(e){const i=pick(e);if(i>=0){const d=G.nodes[i];tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+12)+'px';tip.innerHTML=`<b>${esc(d.label)}</b><br><span style="color:var(--ink-3)">${TYPE[d.type]?.k||d.type} · 연결 ${G.deg[i]}</span>`;canvas.style.cursor='pointer';}else{tip.style.display='none';canvas.style.cursor='grab';}}
function click(e){const i=pick(e);if(i>=0)focusNode(i);else{tip.style.display='none';}}
function focusNode(i){G.focus=i;const p=G.P[i];flyTo(new THREE.Vector3(p[0],p[1],p[2]),Math.max(28,18+G.deg[i]*1.2),900);applyColors();showPanel(i);crumb();}
function home(){G.focus=-1;G.neighborOnly=false;G.visible=G.nodes.map(()=>true);document.getElementById('nb').classList.remove('on');flyTo(new THREE.Vector3(0,0,0),G.fitDist,900);applyColors();document.getElementById('panel').classList.remove('show');crumb();updateCount();}
function toggleNeighbor(force){G.neighborOnly=force===true?true:!G.neighborOnly;document.getElementById('nb').classList.toggle('on',G.neighborOnly);filter();}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function showPanel(i){const d=G.nodes[i];const p=document.getElementById('panel');p.classList.add('show');
  let h=`<div class="type">${esc(TYPE[d.type]?.k||d.type)}${d.severity?`<span class="sev ${d.severity}">${d.severity==='high'?'높음':'중간'}</span>`:''}</div><h2>${esc(d.label)}</h2>`;
  h+=`<dl><dt>범위</dt><dd>${esc(d.scope)}</dd><dt>연결</dt><dd>${G.deg[i]}개</dd>${d.state?`<dt>상태</dt><dd>${esc(d.state)}</dd>`:''}`;
  for(const [k,v] of Object.entries(d.attrs||{}).slice(0,10))h+=`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`; h+='</dl>';
  h+=`<div class="bar"><button id="p-nb">${G.neighborOnly?'전체 다시 보기':'이웃만 보기'}</button><button id="p-home">전체 보기</button></div>`;
  h+=`<h3>연결된 별 (${G.adj[i].length})</h3>`;
  G.adj[i].slice(0,40).forEach(([j,e])=>{const o=G.nodes[j];const out=e.from===d.id;h+=`<div class="edge" data-j="${j}"><span class="t">${out?'→':'←'} ${esc(EDGE_KO[e.type]||e.type)}</span><span>${esc(o.label.length>30?o.label.slice(0,29)+'…':o.label)}</span><span class="d">${e.epistemic==='derived'?'추론':'확인'}</span></div>`;});
  if(G.adj[i].length>40)h+=`<div class="edge"><span class="t">…</span><span>${G.adj[i].length-40}개 더</span></div>`;
  p.innerHTML=h; p.querySelectorAll('.edge[data-j]').forEach(el=>el.onclick=()=>focusNode(+el.dataset.j)); document.getElementById('p-nb').onclick=()=>toggleNeighbor(); document.getElementById('p-home').onclick=home;}
function crumb(){const el=document.getElementById('crumb');if(G.focus<0){el.innerHTML='이 Mac';return;}const d=G.nodes[G.focus];el.innerHTML=`이 Mac › ${esc(d.scope)} › <b>${esc(d.label)}</b>`;}
// ---------- 필터 ----------
const typeState={}; let query='';
function updateTypes(){const box=document.getElementById('types');const counts={};G.nodes.forEach(d=>counts[d.type]=(counts[d.type]||0)+1);box.innerHTML='';Object.keys(TYPE).filter(t=>counts[t]).forEach(t=>{if(typeState[t]==null)typeState[t]=true;const b=document.createElement('button');b.className='chip'+(typeState[t]?'':' off');b.innerHTML=`<i style="background:${TYPE[t].c}"></i>${esc(TYPE[t].k)} <span style="color:var(--ink-3)">${counts[t]}</span>`;b.onclick=()=>{typeState[t]=!typeState[t];b.classList.toggle('off',!typeState[t]);filter();};box.appendChild(b);});}
function filter(){const q=query.trim().toLowerCase();const rel=new Set();if(G.neighborOnly&&G.focus>=0){rel.add(G.focus);G.adj[G.focus].forEach(([j])=>rel.add(j));}
  G.visible=G.nodes.map((d,i)=>typeState[d.type]!==false&&(!q||d.label.toLowerCase().includes(q)||(TYPE[d.type]?.k||'').includes(q)||d.id.toLowerCase().includes(q))&&(!G.neighborOnly||rel.has(i)));applyColors();updateCount();}
function updateCount(){document.getElementById('count').textContent=`표시 ${G.visible.filter(Boolean).length} / ${G.nodes.length}개 별 · 간선 ${G.E.length}개`;}
document.getElementById('q').addEventListener('input',e=>{query=e.target.value;filter();});
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const i=G.visible.findIndex(Boolean);if(i>=0)focusNode(i);}});
document.getElementById('home').onclick=home; document.getElementById('nb').onclick=()=>toggleNeighbor();
document.getElementById('ds-real').onclick=()=>{setDS('real');}; document.getElementById('ds-demo').onclick=()=>{setDS('demo');};
function setDS(k){document.getElementById('ds-real').classList.toggle('on',k==='real');document.getElementById('ds-demo').classList.toggle('on',k==='demo');buildGraph(DATA[k]);home();}
// ---------- 라벨과 루프 ----------
const v=new THREE.Vector3();
function updateLabels(){const {nodes,P,labels,focus,adj,deg,visible}=G;const rel=new Set();if(focus>=0){rel.add(focus);adj[focus].forEach(([j])=>rel.add(j));}
  const near=cam.dist<90; let shown=0;
  nodes.forEach((d,i)=>{const el=labels[i];let show=visible[i]&&(['Agent','Project','Device'].includes(d.type)||(d.type==='Finding'&&d.severity==='high')||rel.has(i)||(near&&deg[i]>=3)||(cam.dist<40));
    if(focus>=0&&!rel.has(i)&&!['Agent','Project','Device'].includes(d.type))show=false; if(shown>60)show=false;
    if(!show){el.style.display='none';return;} v.set(P[i][0],P[i][1],P[i][2]).project(camera); if(v.z>1){el.style.display='none';return;}
    el.style.display='block';el.style.left=((v.x+1)/2*innerWidth)+'px';el.style.top=((1-v.y)/2*innerHeight)+'px';el.style.opacity=rel.has(i)||focus<0?1:.7;shown++;});}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
let last=0; function loop(t){requestAnimationFrame(loop);stepTween();if(!reduced&&!drag&&G&&G.focus<0)cam.theta+=0.0006;placeCamera();if(G){G.halos.material.opacity=0.2+0.1*Math.sin(t*0.002);updateLabels();}renderer.render(scene,camera);}
buildGraph(DATA.real); cam.dist=G.fitDist; requestAnimationFrame(loop);
</script>
